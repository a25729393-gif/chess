name: Build APK 4
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build3.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        run: unzip -q ChessCoach.zip
      - name: Add JitPack repository
        run: |
          sed -i 's|mavenCentral()|mavenCentral()\n        maven { url = uri("https://jitpack.io") }|' ChessCoach/settings.gradle.kts
          cat ChessCoach/settings.gradle.kts
      - name: Build Stockfish
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$(ls -d $ANDROID_HOME/ndk/* | tail -1)}}"
          echo "NDK: $NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          git clone --depth 1 --branch sf_18 https://github.com/official-stockfish/Stockfish.git sf \
            || git clone --depth 1 --branch sf_17.1 https://github.com/official-stockfish/Stockfish.git sf \
            || git clone --depth 1 https://github.com/official-stockfish/Stockfish.git sf
          cd sf/src
          make -j4 build ARCH=armv8 COMP=ndk
          llvm-strip -s stockfish || true
          cp stockfish "$GITHUB_WORKSPACE/ChessCoach/app/src/main/jniLibs/arm64-v8a/libstockfish.so"
      - name: Build
        working-directory: ChessCoach
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ChessCoach/app/build/outputs/apk/debug/app-debug.apk ChessCoach.apk
          gh release create "build-${{ github.run_number }}" ChessCoach.apk --title "Build ${{ github.run_number }}" --notes "Debug APK"
