name: Build APK 2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        run: unzip -q ChessCoach.zip
      - name: Get Stockfish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir sf
          gh release download --repo official-stockfish/Stockfish --pattern '*android-armv8*' --dir sf
          f=$(ls sf | grep -v dotprod | head -1)
          case "$f" in
            *.zip) unzip -q "sf/$f" -d sf ;;
            *) tar -xf "sf/$f" -C sf ;;
          esac
          bin=$(find sf -type f -name 'stockfish-android-armv8*' ! -name '*.tar' ! -name '*.zip' | head -1)
          cp "$bin" ChessCoach/app/src/main/jniLibs/arm64-v8a/libstockfish.so
      - name: Build
        working-directory: ChessCoach
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ChessCoach/app/build/outputs/apk/debug/app-debug.apk ChessCoach.apk
          gh release create "build-${{ github.run_number }}" ChessCoach.apk --title "Build ${{ github.run_number }}" --notes "Debug APK"
